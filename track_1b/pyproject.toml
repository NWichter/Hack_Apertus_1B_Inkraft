[project]
name = "inkraft"
version = "0.1.0"
description = "Short-answer benchmark on Swiss social and health insurance law with an as-of date"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["beautifulsoup4>=4.12"]

[project.scripts]
inkraft = "inkraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkraft"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
