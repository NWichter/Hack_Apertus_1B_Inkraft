<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Inkraft Prüfung</title>
<style>
:root{--bg:#f7f7f5;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#deddd8;--acc:#b4232a;--ok:#1f7a3a;--warn:#a86400;--hl:#fff2a8}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecebe6;--mut:#a3a29c;--card:#22221f;--line:#3a3a36;--acc:#ff6b6b;--ok:#5cc47e;--warn:#e0a040;--hl:#5a4b00}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:2}
header h1{font-size:16px;margin:0}header .sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer}
button.on{border-color:var(--fg);font-weight:600}button.k-ok.on{background:var(--ok);color:#fff}button.k-bad.on{background:var(--acc);color:#fff}button.k-uns.on{background:var(--warn);color:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:13px}.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-top:10px}
.q{font-size:18px;font-weight:600;margin:4px 0}.ans{font-size:17px}.old{color:var(--warn)}
mark{background:var(--hl);color:inherit}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
details summary{cursor:pointer;color:var(--mut)}
textarea{width:100%;min-height:52px;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px}
.tabs{display:flex;gap:8px}.prog{font-variant-numeric:tabular-nums}
pre{white-space:pre-wrap;font:inherit;margin:0;background:var(--bg);padding:8px;border-radius:6px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:16px}@media (max-width:760px){.two{grid-template-columns:1fr}}
.tr{border:2px solid var(--warn);border-radius:8px;padding:10px 12px}.tr .q{font-size:20px}.tr pre{font-size:17px}
.trh{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
.orig .q{font-size:15px;font-weight:500}.orig pre{font-size:14px}
.n{border-radius:4px;padding:0 3px;font-weight:700}.n-g{background:#cdeccf;color:#0d4d1d}.n-o{background:#ffd9a8;color:#6b3a00}.n-m{background:#e6d4f7;color:#4a1f6e}.n-x{background:#ffc9c9;color:#7a0d0d}
#who{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);width:190px}
</style>
</head>
<body>
<header>
  <h1>Inkraft – Prüfung</h1>
  <div class="tabs"><button id="tA">Teil A: Datensatz</button><button id="tB">Teil B: Richter-Stichprobe</button></div>
  <span class="prog mut" id="prog"></span>
  <span class="sp"></span>
  <input id="who" placeholder="Dein Name (für den Export)" autocomplete="off">
  <button id="prev">← zurück</button><button id="next">weiter →</button><button id="exp">Export (JSON)</button>
</header>
<main id="main"></main>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'inkraft-pruefung-v2-' + D.version;
let S = {part: 'A', i: {A: 0, B: 0}, a: {}, b: {}, who: '', started: new Date().toISOString()};
try { const x = JSON.parse(localStorage.getItem(KEY)); if (x) S = x; } catch (e) {}
// part A of the earlier export (Niklas) is taken over; part B always starts empty in this version
for (const [c, v] of Object.entries(D.pre_a || {})) if (!(S.a[c] && S.a[c].v)) S.a[c] = {...v, from: D.pre_a_source};
try { localStorage.removeItem('inkraft-pruefung-' + D.version); } catch (e) {}
let warned = false;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { if (!warned) { warned = true; alert('Zwischenspeichern im Browser nicht möglich – bitte regelmäßig exportieren.'); } } };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list = xs => (xs && xs.length) ? xs.map(esc).join(' · ') : '–';
function hl(text, needle) {
  const t = esc(text); if (!needle) return t;
  const n = esc(needle); const k = t.indexOf(n);
  return k < 0 ? t : t.slice(0, k) + '<mark>' + n + '</mark>' + t.slice(k + n.length);
}
function renderA() {
  const items = D.cores, i = S.i.A, c = items[i]; const a = S.a[c.core_id] || {};
  const lang = l => c.rows[l] ? `
    <div class="lbl">${l.toUpperCase()} · Frage</div><div class="q">${esc(c.rows[l].question)}</div>
    <div class="lbl">Antwort (Gold)</div><div class="ans">${esc(c.rows[l].answer)}</div>
    <div class="mut">Varianten: ${list(c.rows[l].answer_aliases)} &nbsp;|&nbsp; Fast-Treffer (falsch): ${list(c.rows[l].near_miss_answers)}</div>
    ${c.rows[l].outdated_answers && c.rows[l].outdated_answers.length ? `<div class="old">Altantwort (frühere Fassung): ${list(c.rows[l].outdated_answers)}</div>` : ''}
    <div class="lbl">Gesetzestext ${esc(c.act)} Art. ${esc(c.article)}${c.paragraph ? ' Abs. ' + esc(c.paragraph) : ''}, Fassung ${esc(c.version_date)} · <a href="${esc(c.rows[l].url)}" target="_blank" rel="noopener">Fedlex</a></div>
    <pre>${hl(c.rows[l].quote, c.rows[l].evidence)}</pre>
    ${c.rows[l].previous_evidence ? `<div class="lbl">Frühere Fassung (${esc(c.previous_version_date || '')})</div><pre>${esc(c.rows[l].previous_evidence)}</pre>` : ''}` : '';
  document.getElementById('main').innerHTML = `
  <div class="card"><div class="mut">${esc(c.core_id)} · ${esc(c.group)} · ${esc(c.question_type)}</div>
  ${lang('de')}
  <details><summary>FR und IT anzeigen</summary>${lang('fr')}${lang('it')}</details>
  <div class="lbl">Dein Urteil</div>
  <div class="row">
    <button class="k-ok ${a.v==='ok'?'on':''}" data-v="ok"><kbd>1</kbd> richtig, behalten</button>
    <button class="k-bad ${a.v==='drop'?'on':''}" data-v="drop"><kbd>2</kbd> Fehler, streichen</button>
    <button class="k-uns ${a.v==='unsure'?'on':''}" data-v="unsure"><kbd>3</kbd> unsicher</button>
  </div>
  <div class="lbl">Notiz (bei Fehler: was ist falsch?)</div><textarea id="note">${esc(a.note || '')}</textarea>
  </div>
  <div class="mut">Prüfe nur: Stimmt die Gold-Antwort zum Gesetzestext? Ist die Frage eindeutig? Bei Altantwort: Galt das wirklich früher (nicht nur ein neuer Begriff)? FR/IT nur bei Verdacht aufklappen.</div>`;
  document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => setA(b.dataset.v));
  document.getElementById('note').oninput = e => { (S.a[c.core_id] ||= {}).note = e.target.value; save(); };
}
function setA(v) {
  const c = D.cores[S.i.A]; const a = (S.a[c.core_id] ||= {});
  a.v = v; a.at = new Date().toISOString(); a.group = c.group; save(); if (v !== 'drop') step(1); else render();
}
const NUM = /\d{1,3}(?:['’ \u00a0]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?/g;
const normNum = s => String(parseFloat(s.replace(/['’ \u00a0]/g, '').replace(',', '.')));
const numSet = xs => new Set((xs || []).flatMap(x => (String(x ?? '').match(NUM) || []).map(normNum)));
function marks(r, src) {
  return {g: numSet([src.answer, ...(src.answer_aliases || [])]), o: numSet(src.outdated_answers), m: numSet(src.near_miss_answers)};
}
function hlNums(text, m) {
  // numbers of the answer: green = gold or variant, orange = outdated answer, purple = near miss, red = none of them
  let out = '', last = 0;
  for (const x of String(text ?? '').matchAll(NUM)) {
    const v = normNum(x[0]);
    const c = m.g.has(v) ? 'n-g' : m.o.has(v) ? 'n-o' : m.m.has(v) ? 'n-m' : 'n-x';
    out += esc(text.slice(last, x.index)) + `<span class="n ${c}">${esc(x[0])}</span>`;
    last = x.index + x[0].length;
  }
  return out + esc(String(text ?? '').slice(last));
}
function block(src, m, cls) {
  return `<div class="${cls}">
  <div class="lbl">Frage</div><div class="q">${esc(src.question)}</div>
  <div class="lbl">Gold</div><div class="ans">${hlNums(src.answer, m)}</div>
  <div class="mut">Varianten: ${(src.answer_aliases || []).length ? src.answer_aliases.map(x => hlNums(x, m)).join(' · ') : '–'}</div>
  <div class="old">Altantworten (veraltet): ${(src.outdated_answers || []).length ? src.outdated_answers.map(x => hlNums(x, m)).join(' · ') : '–'}</div>
  <div class="mut">Fast-Treffer (falsch): ${(src.near_miss_answers || []).length ? src.near_miss_answers.map(x => hlNums(x, m)).join(' · ') : '–'}</div>
  <div class="lbl">Antwort des Modells</div><pre>${hlNums(src.response, m)}</pre></div>`;
}
const LEGEND = `<div class="mut">Zahlen: <span class="n n-g">wie Gold/Variante</span> <span class="n n-o">wie Altantwort</span>
  <span class="n n-m">wie Fast-Treffer</span> <span class="n n-x">kommt dort nicht vor</span> – nur eine Lesehilfe, entscheidend ist der Inhalt.</div>`;
function renderB() {
  const items = D.judge, i = S.i.B, r = items[i]; const b = S.b[r.key] || {};
  const m = marks(r, r);
  const body = r.de ? `<div class="two">
    ${block(r, m, 'orig')}
    <div class="tr"><div class="trh">Maschinelle Übersetzung (${esc(r.de.model)}), Original links</div>${block({...r.de}, marks(r, r.de), '')}</div>
  </div>` : block(r, m, '');
  document.getElementById('main').innerHTML = `
  <div class="card"><div class="mut">${esc(r.id)} · Sprache ${esc((r.lang || '').toUpperCase())} · ${esc(r.model)} · ${esc(r.condition)} (Richter-Urteil verdeckt)</div>
  ${body}
  ${LEGEND}
  <div class="row">
    <button class="${b.g==='CORRECT'?'on k-ok':''}" data-g="CORRECT"><kbd>1</kbd> richtig</button>
    <button class="${b.g==='OTHER'?'on k-bad':''}" data-g="OTHER"><kbd>2</kbd> falsch</button>
    <button class="${b.g==='STALE'?'on k-bad':''}" data-g="STALE"><kbd>s</kbd> falsch: veraltet</button>
    <button class="${b.g==='NEAR_MISS'?'on k-bad':''}" data-g="NEAR_MISS"><kbd>m</kbd> falsch: Fast-Treffer</button>
    <button class="${b.g==='NOT_ATTEMPTED'?'on k-uns':''}" data-g="NOT_ATTEMPTED"><kbd>3</kbd> nicht beantwortet</button>
    <button class="${b.u?'on':''}" id="unsure"><kbd>?</kbd> unsicher</button>
  </div></div>
  <div class="mut">Regel wie beim Richter: richtig = enthält Gold oder Variante, widerspricht nicht; falsch = anderer Wert oder mehrere widersprüchliche Antworten; nicht beantwortet = keine eindeutige Antwort und nichts Falsches.</div>`;
  document.querySelectorAll('[data-g]').forEach(x => x.onclick = () => setB(x.dataset.g));
  document.getElementById('unsure').onclick = () => { (S.b[r.key] ||= {}).u = !((S.b[r.key] || {}).u); save(); render(); };
}
function setB(g) {
  const r = D.judge[S.i.B]; const b = (S.b[r.key] ||= {}); b.g = g; b.at = new Date().toISOString();
  b.lang = r.lang; b.translation_aid = !!r.de; save(); step(1);
}
function step(d) {
  const n = S.part === 'A' ? D.cores.length : D.judge.length;
  S.i[S.part] = Math.max(0, Math.min(n - 1, S.i[S.part] + d)); save(); render();
}
function render() {
  document.getElementById('tA').classList.toggle('on', S.part === 'A');
  document.getElementById('tB').classList.toggle('on', S.part === 'B');
  const da = Object.values(S.a).filter(x => x.v).length, db = Object.values(S.b).filter(x => x.g).length;
  document.getElementById('prog').textContent =
    `A ${da}/${D.cores.length} · B ${db}/${D.judge.length} · jetzt ${S.part} ${S.i[S.part] + 1}`;
  S.part === 'A' ? renderA() : renderB(); window.scrollTo(0, 0);
}
document.getElementById('tA').onclick = () => { S.part = 'A'; save(); render(); };
document.getElementById('tB').onclick = () => { S.part = 'B'; save(); render(); };
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
const who = document.getElementById('who');
who.value = S.who || '';
who.oninput = () => { S.who = who.value; save(); };
document.getElementById('exp').onclick = () => {
  if (!(S.who || '').trim()) { alert('Bitte oben deinen Namen eintragen – er steht im Export als Bearbeiter.'); who.focus(); return; }
  const judge = {};
  for (const [k, v] of Object.entries(S.b)) { const r = D.judge.find(x => x.key === k); judge[k] = {...v, lang: r ? r.lang : v.lang, translation_aid: r ? !!r.de : !!v.translation_aid}; }
  const out = {version: D.version, exported_at: new Date().toISOString(), started: S.started, annotator: S.who.trim(),
    translation_aid: 'FR/IT rows of part B shown with a German machine translation (Apertus 70B) next to the original',
    part_a_source: D.pre_a_source, dataset: S.a, judge};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'inkraft-pruefung-' + D.version + '.json'; document.body.appendChild(a); a.click(); a.remove();
};
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1);
  else if (S.part === 'A' && ({'1': 'ok', '2': 'drop', '3': 'unsure'})[e.key]) setA({'1': 'ok', '2': 'drop', '3': 'unsure'}[e.key]);
  else if (S.part === 'B') {
    const g = {'1': 'CORRECT', '2': 'OTHER', 's': 'STALE', 'm': 'NEAR_MISS', '3': 'NOT_ATTEMPTED'}[e.key];
    if (g) setB(g); else if (e.key === '?') document.getElementById('unsure').click();
  }
});
render();
</script>
</body>
</html>
